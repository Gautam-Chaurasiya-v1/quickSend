name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: quicksend-extension
          path: |
            dist/extension
            dist/checksums.json
          retention-days: 7
