name: Release extension
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node scripts/release-check.js
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run verify
      - run: npm run package
      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/quicksend-extension.zip dist/SHA256SUMS dist/checksums.json --verify-tag --title "QuickSend $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
